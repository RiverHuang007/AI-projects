<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日语录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 50%, #f8cdda 100%);
            font-family: 'Georgia', 'Times New Roman', '宋体', serif;
            padding: 40px 20px;
        }

        /* ---- main layout ---- */
        .page-wrap {
            display: flex;
            gap: 28px;
            align-items: flex-start;
            max-width: 1060px;
            width: 100%;
            justify-content: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            max-width: 700px;
            width: 100%;
            padding: 60px 45px 45px;
            border-radius: 28px;
            box-shadow: 0 25px 55px rgba(180, 120, 80, 0.18), 0 8px 22px rgba(160, 110, 70, 0.10);
            text-align: center;
            transition: all 0.3s ease;
        }

        .quote-text {
            font-size: 32px;
            font-weight: 400;
            line-height: 1.65;
            color: #2d221c;
            letter-spacing: 0.02em;
            margin-bottom: 35px;
            min-height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .quote-text::before {
            content: '\201C';
            font-size: 72px;
            color: #c9a88c;
            position: absolute;
            top: -16px;
            left: -8px;
            opacity: 0.4;
            font-family: 'Georgia', serif;
        }

        .quote-author {
            font-size: 19px;
            font-style: italic;
            color: #8b7355;
            margin-bottom: 12px;
            letter-spacing: 0.03em;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .btn-next {
            display: inline-block;
            padding: 13px 44px;
            background: #c9a88c;
            color: #fff;
            font-size: 17px;
            font-family: inherit;
            border: none;
            border-radius: 36px;
            cursor: pointer;
            transition: all 0.27s ease;
            box-shadow: 0 4px 11px rgba(170, 125, 75, 0.23);
            letter-spacing: 0.04em;
        }

        .btn-next:hover {
            transform: scale(1.05);
            background: #ba916f;
            box-shadow: 0 8px 21px rgba(150, 105, 62, 0.29);
        }

        .btn-next:active {
            transform: scale(0.97);
        }

        /* ---- favorite button ---- */
        .btn-fav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 13px 36px;
            background: #fff;
            color: #b8877a;
            font-size: 17px;
            font-family: inherit;
            border: 2px solid #e8cfc4;
            border-radius: 36px;
            cursor: pointer;
            transition: all 0.27s ease;
            letter-spacing: 0.04em;
        }

        .btn-fav:hover {
            border-color: #e07a6a;
            color: #e07a6a;
            transform: scale(1.05);
        }

        .btn-fav:active {
            transform: scale(0.97);
        }

        .btn-fav.active {
            background: #ffeef0;
            border-color: #e07a6a;
            color: #e07a6a;
        }

        /* ---- favorites panel ---- */
        .favorites-panel {
            width: 300px;
            max-height: 520px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            box-shadow: 0 25px 55px rgba(180, 120, 80, 0.18), 0 8px 22px rgba(160, 110, 70, 0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .panel-header {
            padding: 28px 24px 16px;
            font-size: 20px;
            color: #2d221c;
            border-bottom: 1px solid #f0e4dc;
            letter-spacing: 0.03em;
            flex-shrink: 0;
        }

        .favorites-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .favorites-list::-webkit-scrollbar {
            width: 6px;
        }
        .favorites-list::-webkit-scrollbar-thumb {
            background: #d4c0b0;
            border-radius: 3px;
        }

        .fav-empty {
            padding: 40px 24px;
            text-align: center;
            color: #b8a89a;
            font-size: 15px;
            line-height: 1.7;
        }

        .fav-item {
            padding: 14px 24px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid #f5ede6;
            position: relative;
        }

        .fav-item:last-child {
            border-bottom: none;
        }

        .fav-item:hover {
            background: #fdf5f0;
        }

        .fav-item-text {
            font-size: 14px;
            color: #2d221c;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .fav-item-author {
            font-size: 12px;
            color: #b8877a;
            font-style: italic;
        }

        .fav-item-remove {
            position: absolute;
            top: 12px;
            right: 14px;
            font-size: 14px;
            color: #d4a89a;
            cursor: pointer;
            opacity: 0;
            transition: all 0.2s;
            background: none;
            border: none;
            padding: 2px 6px;
            border-radius: 10px;
            line-height: 1;
        }

        .fav-item:hover .fav-item-remove {
            opacity: 1;
        }

        .fav-item-remove:hover {
            background: #fde8e4;
            color: #e07a6a;
        }

        /* ---- responsive ---- */
        @media (max-width: 860px) {
            .page-wrap {
                flex-direction: column;
                align-items: center;
            }
            .favorites-panel {
                width: 100%;
                max-width: 700px;
                max-height: 320px;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 20px 14px;
            }
            .card {
                padding: 38px 26px 34px;
            }
            .quote-text {
                font-size: 24px;
                min-height: 96px;
            }
            .quote-author {
                font-size: 16px;
            }
            .btn-group {
                flex-direction: column;
                align-items: center;
            }
            .btn-next,
            .btn-fav {
                padding: 11px 31px;
                font-size: 15px;
                width: 100%;
                justify-content: center;
            }
            .panel-header {
                padding: 20px 20px 12px;
                font-size: 18px;
            }
            .fav-item {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>

<div class="page-wrap">
    <div class="card">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-author" id="quoteAuthor"></div>
        <div class="btn-group">
            <button class="btn-next" id="nextBtn">⟳ 换一句</button>
            <button class="btn-fav" id="favBtn">❤️ 收藏</button>
        </div>
    </div>

    <div class="favorites-panel">
        <div class="panel-header">⭐ 我的收藏</div>
        <div class="favorites-list" id="favoritesList"></div>
    </div>
</div>

<script>
    const quotes = [
        { text: '生活就像一盒巧克力，你永远不知道下一颗是什么味道。', author: '《阿甘正传》' },
        { text: '千里之行，始于足下。', author: '老子' },
        { text: 'The only way to do great work is to love what you do.', author: 'Steve Jobs' },
        { text: '人生如逆旅，我亦是行人。', author: '苏轼' },
        { text: 'Stay hungry, stay foolish.', author: 'Steve Jobs' },
        { text: '知之为知之，不知为不知，是知也。', author: '孔子' },
        { text: 'In the middle of difficulty lies opportunity.', author: 'Albert Einstein' },
        { text: '长风破浪会有时，直挂云帆济沧海。', author: '李白' },
        { text: 'The best time to plant a tree was 20 years ago. The second best time is now.', author: 'Chinese Proverb' },
        { text: '勿以恶小而为之，勿以善小而不为。', author: '刘备' },
        { text: 'Simplicity is the ultimate sophistication.', author: 'Leonardo da Vinci' },
        { text: '业精于勤，荒于嬉；行成于思，毁于随。', author: '韩愈' }
    ];

    const quoteTextEl = document.getElementById('quoteText');
    const quoteAuthorEl = document.getElementById('quoteAuthor');
    const nextBtn = document.getElementById('nextBtn');
    const favBtn = document.getElementById('favBtn');
    const favoritesListEl = document.getElementById('favoritesList');

    /* ---- state ---- */
    let currentQuote = null;

    function loadFavorites() {
        try {
            return JSON.parse(localStorage.getItem('daily-quote-favorites')) || [];
        } catch {
            return [];
        }
    }

    function saveFavorites(list) {
        localStorage.setItem('daily-quote-favorites', JSON.stringify(list));
    }

    function isFavorited(quote) {
        return loadFavorites().some(f => f.text === quote.text && f.author === quote.author);
    }

    /* ---- render ---- */
    function updateFavButton() {
        const favorited = currentQuote && isFavorited(currentQuote);
        favBtn.classList.toggle('active', favorited);
        favBtn.textContent = favorited ? '💖 已收藏' : '❤️ 收藏';
    }

    function renderFavorites() {
        const list = loadFavorites();
        if (list.length === 0) {
            favoritesListEl.innerHTML = '<div class="fav-empty">还没有收藏<br>点击「❤️ 收藏」添加你喜欢的语录</div>';
            return;
        }
        favoritesListEl.innerHTML = list.map((f, i) => `
            <div class="fav-item" data-index="${i}">
                <div class="fav-item-text">"${f.text}"</div>
                <div class="fav-item-author">—— ${f.author}</div>
                <button class="fav-item-remove" data-index="${i}" title="取消收藏">✕</button>
            </div>
        `).join('');
    }

    function getRandomQuote() {
        return quotes[Math.floor(Math.random() * quotes.length)];
    }

    function displayQuote() {
        currentQuote = getRandomQuote();
        quoteTextEl.textContent = currentQuote.text;
        quoteAuthorEl.textContent = '—— ' + currentQuote.author;
        updateFavButton();
    }

    /* ---- toggle favorite ---- */
    function toggleFavorite() {
        if (!currentQuote) return;
        const list = loadFavorites();
        const idx = list.findIndex(f => f.text === currentQuote.text && f.author === currentQuote.author);
        if (idx >= 0) {
            list.splice(idx, 1);
        } else {
            list.unshift({ text: currentQuote.text, author: currentQuote.author });
        }
        saveFavorites(list);
        updateFavButton();
        renderFavorites();
    }

    function removeFavorite(index) {
        const list = loadFavorites();
        const removed = list.splice(index, 1)[0];
        saveFavorites(list);
        renderFavorites();
        // 如果当前显示的就是被取消收藏的那句，更新按钮状态
        if (currentQuote && removed && currentQuote.text === removed.text && currentQuote.author === removed.author) {
            updateFavButton();
        }
    }

    /* ---- events ---- */
    nextBtn.addEventListener('click', displayQuote);
    favBtn.addEventListener('click', toggleFavorite);

    // 用事件委托处理收藏列表中的点击
    favoritesListEl.addEventListener('click', function(e) {
        const removeBtn = e.target.closest('.fav-item-remove');
        if (removeBtn) {
            e.stopPropagation();
            removeFavorite(Number(removeBtn.dataset.index));
            return;
        }
        const item = e.target.closest('.fav-item');
        if (item) {
            // 点击收藏项 → 取消收藏
            removeFavorite(Number(item.dataset.index));
        }
    });

    /* ---- init ---- */
    displayQuote();
    renderFavorites();
</script>

</body>
</html>
